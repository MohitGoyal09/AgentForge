[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "An open-source agentic coding harness for building and studying AI coding agents"
readme = "README.MD"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AgentForge Contributors"},
]
keywords = ["ai", "codex", "coding-agent", "llm", "agent-harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai",
    "pydantic>=2.0",
    "rich",
    "httpx",
    "click",
    "python-dotenv",
    "platformdirs",
    "tiktoken",
    "tomli; python_version < '3.11'",
    "ddgs",
    "fastmcp",
]

[project.urls]
Homepage = "https://github.com/anthropics/agentforge"
Repository = "https://github.com/anthropics/agentforge"
Documentation = "https://github.com/anthropics/agentforge#readme"

[project.scripts]
agentforge = "cli.run:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agent*", "cli*", "client*", "config*", "context*", "hooks*", "prompts*", "safety*", "tools*", "ui*", "utils*", "skills*"]
